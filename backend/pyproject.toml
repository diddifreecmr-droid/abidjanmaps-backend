[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abidjanmaps-backend"
version = "1.0.0"
description = "AbidjanMaps routing backend V1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "asyncpg>=0.29",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.17",
  "alembic>=1.13",
  "PyJWT>=2.9",
  "pwdlib[argon2]>=0.2",
  "osmium>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
